[package]
name = "lucamedia"
version = "1.0.2"
description = "Lucamedia — téléchargeur de vidéos HLS/m3u8 avec vérification d'intégrité"
edition = "2021"
rust-version = "1.80"

[lib]
name = "lucamedia_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "lucamedia"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "brotli", "stream"] }
anyhow = "1"
regex = "1"
url = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
aes = "0.8"
cbc = { version = "0.1", features = ["std"] }
dirs = "6"
urlencoding = "2"
# deps ajoutées par les modules
tokio-tungstenite = "0.30"

[dev-dependencies]
tempfile = "3"

[profile.dev]
debug = 0
incremental = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
